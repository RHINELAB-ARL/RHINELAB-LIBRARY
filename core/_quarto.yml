project:
  type: website
  output-dir: public
  resources:
    - "CNAME"
    - robots.txt

execute:
  freeze: auto

website:
  title: "Modelling, Theoretical Artificial Intelligence and Learning-theoretic Group (MTAIL)"
  site-url: https://amane-fujimiya.github.io/
  repo-url: https://github.com/Amane-Fujimiya/
  repo-actions: [edit, issue, source]
  
  search:
    location: sidebar
    type: textbox
    limit: 30
    collapse-after: 3
    show-item-context: tree
    copy-button: true

  navbar:
    right:
      - href: index.qmd
        text: Central
      - href: about.qmd
        text: Information
      - href: contents/updates/post.qmd
        text: Research and Updates

  sidebar:
    style: floating
    pinned: true
    collapse-level: 2
    border: true
    search: true
    tools:
      - icon: house
        href: https://amane-fujimiya.github.io/
        text: RHINELAB
    contents: 
      - index.qmd
      - section: "Documentations"
        contents: 
          - contents/research/R0-core-knowledge/R0.Core_Knowledge.qmd
      - section: "Literature and Reading"
        contents:
          - contents/reading/library.qmd
      - section: "Research"
        contents:
          - contents/research/research.qmd
          - section: "Double Descent"
            contents: 
              - contents/research/R1-double-descent/R1.1.qmd
              - contents/research/R1-double-descent/contents_research/research_details.qmd
              - contents/research/R1-double-descent/content_literature/literature.qmd
      - contents/bibliography.qmd

  page-footer:
    left: |
      All content licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) · &copy; Bui Gia Khanh.
    center: |
      [Website](https://amane-fujimiya.github.io/) · [GitHub](https://github.com/Amane-Fujimiya) · [Blog](https://amane-fujimiya.github.io/blogs) · RHINELAB-RINALAB - MTAIL
    right: Built with [Quarto](https://quarto.org/).

bibliography: references.bib
date-modified: last-modified

format:
  rhinelab-html:
    number-sections: true
    number-depth: 3
    code-link: true
    code-tools:
      toggle: true
    code-fold: false
    code-overflow: wrap
    reference-location: margin

latex-auto-install: true

knitr:
  opts_chunk:
    cache: true
    cache.lazy: false
    dpi: 600
    fig.width: 5.5
    fig.height: 3
    out.width: "100%"
    split: true
    R.options:
      knitr.graphics.auto_pdf: true
      datatable.print.nrows: 10
      datatable.print.class: false
      datatable.print.keys: false
      datatable.print.trunc.cols: TRUE